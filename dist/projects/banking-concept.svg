<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="cardDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <filter id="shadow3" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad3)"/>

  <!-- Phone Container -->
  <g transform="translate(140, 45)" filter="url(#shadow3)">
    <rect width="250" height="420" rx="36" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="90" y="12" width="70" height="16" rx="8" fill="#0f172a"/>

    <!-- App Header -->
    <g transform="translate(20, 44)">
      <circle cx="14" cy="14" r="12" fill="#eff6ff"/>
      <rect x="36" y="6" width="60" height="6" rx="3" fill="#94a3b8"/>
      <rect x="36" y="16" width="85" height="8" rx="4" fill="#0f172a"/>
      <circle cx="195" cy="14" r="12" fill="#f8fafc" stroke="#e2e8f0"/>
    </g>

    <!-- Credit / Debit Card Mockup -->
    <g transform="translate(20, 84)">
      <rect width="210" height="125" rx="18" fill="url(#cardDark)"/>
      <!-- Chip -->
      <rect x="18" y="20" width="28" height="20" rx="4" fill="#fbbf24" opacity="0.9"/>
      <circle cx="175" cy="28" r="12" fill="#ffffff" opacity="0.15"/>
      <circle cx="160" cy="28" r="12" fill="#ffffff" opacity="0.15"/>
      <rect x="18" y="70" width="110" height="8" rx="4" fill="#94a3b8" opacity="0.6"/>
      <rect x="18" y="94" width="70" height="10" rx="4" fill="#ffffff"/>
      <rect x="150" y="96" width="42" height="8" rx="4" fill="#94a3b8"/>
    </g>

    <!-- Quick Action Circles -->
    <g transform="translate(20, 225)">
      <g transform="translate(0, 0)">
        <circle cx="20" cy="20" r="20" fill="#eff6ff"/>
        <path d="M14 20 L26 20 M20 14 L20 26" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
        <rect x="5" y="46" width="30" height="5" rx="2.5" fill="#64748b"/>
      </g>
      <g transform="translate(56, 0)">
        <circle cx="20" cy="20" r="20" fill="#f1f5f9"/>
        <path d="M14 24 L26 16 M26 16 L20 16 M26 16 L26 22" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round"/>
        <rect x="5" y="46" width="30" height="5" rx="2.5" fill="#64748b"/>
      </g>
      <g transform="translate(112, 0)">
        <circle cx="20" cy="20" r="20" fill="#f1f5f9"/>
        <rect x="14" y="14" width="12" height="12" rx="3" stroke="#0f172a" stroke-width="1.8" fill="none"/>
        <rect x="5" y="46" width="30" height="5" rx="2.5" fill="#64748b"/>
      </g>
      <g transform="translate(168, 0)">
        <circle cx="20" cy="20" r="20" fill="#f1f5f9"/>
        <circle cx="20" cy="20" r="6" stroke="#0f172a" stroke-width="1.8" fill="none"/>
        <rect x="5" y="46" width="30" height="5" rx="2.5" fill="#64748b"/>
      </g>
    </g>

    <!-- Recent Transactions -->
    <g transform="translate(20, 298)">
      <rect width="210" height="42" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
      <circle cx="20" cy="21" r="12" fill="#eff6ff"/>
      <rect x="42" y="13" width="70" height="6" rx="3" fill="#0f172a"/>
      <rect x="42" y="23" width="45" height="5" rx="2.5" fill="#94a3b8"/>
      <rect x="150" y="16" width="42" height="8" rx="4" fill="#059669"/>
    </g>

    <g transform="translate(20, 348)">
      <rect width="210" height="42" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
      <circle cx="20" cy="21" r="12" fill="#fef2f2"/>
      <rect x="42" y="13" width="60" height="6" rx="3" fill="#0f172a"/>
      <rect x="42" y="23" width="40" height="5" rx="2.5" fill="#94a3b8"/>
      <rect x="150" y="16" width="42" height="8" rx="4" fill="#dc2626"/>
    </g>
  </g>

  <!-- Right Side Analytics Panel -->
  <g transform="translate(420, 90)" filter="url(#shadow3)">
    <rect width="260" height="330" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

    <g transform="translate(24, 24)">
      <rect x="0" y="0" width="110" height="10" rx="5" fill="#0f172a"/>
      <rect x="0" y="16" width="75" height="6" rx="3" fill="#94a3b8"/>
      
      <!-- Mini Chart -->
      <g transform="translate(0, 45)">
        <rect width="212" height="110" rx="14" fill="#eff6ff" stroke="#dbeafe"/>
        <!-- Chart bars -->
        <rect x="18" y="60" width="14" height="35" rx="4" fill="#93c5fd"/>
        <rect x="44" y="45" width="14" height="50" rx="4" fill="#93c5fd"/>
        <rect x="70" y="25" width="14" height="70" rx="4" fill="#2563eb"/>
        <rect x="96" y="50" width="14" height="45" rx="4" fill="#93c5fd"/>
        <rect x="122" y="35" width="14" height="60" rx="4" fill="#2563eb"/>
        <rect x="148" y="70" width="14" height="25" rx="4" fill="#93c5fd"/>
        <rect x="174" y="40" width="14" height="55" rx="4" fill="#93c5fd"/>
      </g>

      <!-- Security / Insight Pill -->
      <g transform="translate(0, 175)">
        <rect width="212" height="48" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
        <circle cx="24" cy="24" r="10" fill="#ecfdf5"/>
        <path d="M20 24 L23 27 L28 21" stroke="#059669" stroke-width="1.8" stroke-linecap="round"/>
        <rect x="44" y="16" width="90" height="6" rx="3" fill="#0f172a"/>
        <rect x="44" y="26" width="120" height="5" rx="2.5" fill="#94a3b8"/>
      </g>

      <!-- Spend Category breakdown -->
      <g transform="translate(0, 238)">
        <rect width="100" height="28" rx="8" fill="#0f172a"/>
        <rect x="18" y="11" width="64" height="6" rx="3" fill="#ffffff"/>
      </g>
    </g>
  </g>
</svg>

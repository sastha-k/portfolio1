<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow2" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad2)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.3">
    <line x1="150" y1="0" x2="150" y2="500" stroke="#cbd5e1" stroke-dasharray="3 3"/>
    <line x1="400" y1="0" x2="400" y2="500" stroke="#cbd5e1" stroke-dasharray="3 3"/>
    <line x1="650" y1="0" x2="650" y2="500" stroke="#cbd5e1" stroke-dasharray="3 3"/>
  </g>

  <!-- Desktop Browser Window Frame -->
  <g transform="translate(100, 40)" filter="url(#shadow2)">
    <rect width="600" height="420" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    
    <!-- Window Bar -->
    <rect width="600" height="38" rx="16" fill="#f8fafc"/>
    <path d="M0 22 H600" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="24" cy="18" r="5" fill="#f87171"/>
    <circle cx="40" cy="18" r="5" fill="#fbbf24"/>
    <circle cx="56" cy="18" r="5" fill="#34d399"/>
    
    <!-- Browser URL pill -->
    <rect x="180" y="8" width="240" height="22" rx="11" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="230" y="16" width="140" height="6" rx="3" fill="#94a3b8"/>

    <!-- Store Header -->
    <g transform="translate(30, 56)">
      <rect x="0" y="0" width="80" height="12" rx="4" fill="#0f172a"/>
      <rect x="120" y="3" width="40" height="6" rx="3" fill="#64748b"/>
      <rect x="175" y="3" width="40" height="6" rx="3" fill="#64748b"/>
      <rect x="230" y="3" width="40" height="6" rx="3" fill="#64748b"/>
      <rect x="480" y="0" width="60" height="12" rx="6" fill="#2563eb"/>
    </g>

    <!-- Main Content Layout (Sidebar Filters + Products Grid) -->
    <!-- Sidebar Filters -->
    <g transform="translate(30, 90)">
      <rect width="130" height="300" rx="12" fill="#f8fafc" stroke="#f1f5f9"/>
      <rect x="16" y="16" width="60" height="8" rx="4" fill="#0f172a"/>
      <rect x="16" y="36" width="90" height="6" rx="3" fill="#94a3b8"/>
      <rect x="16" y="52" width="80" height="6" rx="3" fill="#94a3b8"/>
      <rect x="16" y="68" width="70" height="6" rx="3" fill="#94a3b8"/>

      <line x1="16" y1="92" x2="114" y2="92" stroke="#e2e8f0"/>

      <rect x="16" y="108" width="50" height="8" rx="4" fill="#0f172a"/>
      <rect x="16" y="128" width="16" height="16" rx="4" fill="#2563eb"/>
      <rect x="40" y="133" width="60" height="6" rx="3" fill="#64748b"/>
      <rect x="16" y="152" width="16" height="16" rx="4" fill="#e2e8f0"/>
      <rect x="40" y="157" width="50" height="6" rx="3" fill="#64748b"/>
      <rect x="16" y="176" width="16" height="16" rx="4" fill="#e2e8f0"/>
      <rect x="40" y="181" width="65" height="6" rx="3" fill="#64748b"/>

      <rect x="16" y="248" width="98" height="26" rx="8" fill="#0f172a"/>
      <rect x="36" y="258" width="58" height="6" rx="3" fill="#ffffff"/>
    </g>

    <!-- Product Cards Grid -->
    <g transform="translate(180, 90)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="190" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
        <rect x="8" y="8" width="164" height="100" rx="8" fill="#f1f5f9"/>
        <circle cx="90" cy="58" r="24" fill="#cbd5e1"/>
        <rect x="14" y="120" width="110" height="8" rx="4" fill="#0f172a"/>
        <rect x="14" y="134" width="60" height="6" rx="3" fill="#94a3b8"/>
        <rect x="14" y="156" width="50" height="12" rx="4" fill="#0f172a"/>
        <rect x="120" y="152" width="46" height="20" rx="6" fill="#2563eb"/>
      </g>

      <!-- Card 2 -->
      <g transform="translate(200, 0)">
        <rect width="180" height="190" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
        <rect x="8" y="8" width="164" height="100" rx="8" fill="#eff6ff"/>
        <circle cx="90" cy="58" r="24" fill="#93c5fd"/>
        <rect x="14" y="120" width="120" height="8" rx="4" fill="#0f172a"/>
        <rect x="14" y="134" width="70" height="6" rx="3" fill="#94a3b8"/>
        <rect x="14" y="156" width="50" height="12" rx="4" fill="#0f172a"/>
        <rect x="120" y="152" width="46" height="20" rx="6" fill="#2563eb"/>
      </g>

      <!-- Bottom Promotional / Cart Bar -->
      <g transform="translate(0, 206)">
        <rect width="380" height="84" rx="12" fill="#0f172a"/>
        <rect x="20" y="24" width="140" height="10" rx="5" fill="#ffffff"/>
        <rect x="20" y="42" width="190" height="7" rx="3.5" fill="#94a3b8"/>
        <rect x="260" y="26" width="100" height="32" rx="8" fill="#2563eb"/>
        <rect x="280" y="38" width="60" height="8" rx="4" fill="#ffffff"/>
      </g>
    </g>
  </g>
</svg>

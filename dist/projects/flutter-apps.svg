<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="flutterBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02569B" />
      <stop offset="100%" stop-color="#0175C2" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#flutterBg)" />
  <circle cx="400" cy="250" r="200" fill="#02569B" opacity="0.15" filter="blur(80px)" />

  <!-- Phone 1 (Left Tilt) -->
  <g transform="translate(180, 50) rotate(-6)">
    <!-- Device Frame -->
    <rect width="190" height="370" rx="28" fill="#111827" stroke="#374151" stroke-width="4" />
    <!-- Screen -->
    <rect x="8" y="8" width="174" height="354" rx="22" fill="#0f172a" />
    
    <!-- Dynamic Island / Speaker notch -->
    <rect x="65" y="16" width="60" height="12" rx="6" fill="#030712" />

    <!-- App Header -->
    <text x="24" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" fill="#ffffff">Finance Go</text>
    <circle cx="160" cy="50" r="10" fill="#3b82f6" />

    <!-- Card -->
    <rect x="18" y="70" width="154" height="85" rx="12" fill="url(#phoneGrad)" />
    <text x="30" y="94" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#bae6fd">Total Balance</text>
    <text x="30" y="118" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="18" fill="#ffffff">$14,820.50</text>
    <text x="30" y="140" font-family="'JetBrains Mono', monospace" font-size="9" fill="#93c5fd">•••• 4892</text>

    <!-- Quick action buttons -->
    <g transform="translate(18, 170)">
      <circle cx="20" cy="20" r="18" fill="#1e293b" />
      <text x="20" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#38bdf8" text-anchor="middle">↑</text>
      <circle cx="68" cy="20" r="18" fill="#1e293b" />
      <text x="68" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#34d399" text-anchor="middle">↓</text>
      <circle cx="116" cy="20" r="18" fill="#1e293b" />
      <text x="116" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#a855f7" text-anchor="middle">⚡</text>
    </g>

    <!-- Transactions List -->
    <g transform="translate(18, 230)">
      <rect width="154" height="36" rx="8" fill="#1e293b" opacity="0.7" />
      <text x="12" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#ffffff">Apple Store</text>
      <text x="142" y="22" font-family="'JetBrains Mono', monospace" font-size="10" fill="#f43f5e" text-anchor="end">-$199</text>

      <rect y="44" width="154" height="36" rx="8" fill="#1e293b" opacity="0.7" />
      <text x="12" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#ffffff">Freelance Pay</text>
      <text x="142" y="66" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34d399" text-anchor="end">+$850</text>
    </g>
  </g>

  <!-- Phone 2 (Right Center) -->
  <g transform="translate(430, 60) rotate(5)">
    <!-- Device Frame -->
    <rect width="190" height="370" rx="28" fill="#111827" stroke="#475569" stroke-width="4" />
    <!-- Screen -->
    <rect x="8" y="8" width="174" height="354" rx="22" fill="#090d16" />

    <!-- Speaker notch -->
    <rect x="65" y="16" width="60" height="12" rx="6" fill="#030712" />

    <!-- App Header -->
    <text x="24" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" fill="#ffffff">FitTrack Pro</text>

    <!-- Activity Ring -->
    <circle cx="95" cy="120" r="45" fill="none" stroke="#1e293b" stroke-width="8" />
    <circle cx="95" cy="120" r="45" fill="none" stroke="#02569B" stroke-width="8" stroke-dasharray="280" stroke-dashoffset="70" stroke-linecap="round" />
    <circle cx="95" cy="120" r="32" fill="none" stroke="#0175C2" stroke-width="8" stroke-dasharray="200" stroke-dashoffset="60" stroke-linecap="round" />
    <text x="95" y="125" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="14" fill="#ffffff" text-anchor="middle">78%</text>

    <!-- Stat boxes -->
    <g transform="translate(18, 185)">
      <rect width="72" height="55" rx="8" fill="#1e293b" />
      <text x="10" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94a3b8">Calories</text>
      <text x="10" y="42" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="13" fill="#f59e0b">620 kcal</text>

      <g transform="translate(80, 0)">
        <rect width="74" height="55" rx="8" fill="#1e293b" />
        <text x="10" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94a3b8">Distance</text>
        <text x="10" y="42" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="13" fill="#38bdf8">7.4 km</text>
      </g>
    </g>

    <!-- Flutter Bloc Tag -->
    <g transform="translate(18, 260)">
      <rect width="154" height="32" rx="6" fill="#02569B" opacity="0.3" stroke="#0284c7" stroke-width="1" />
      <text x="77" y="20" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8" text-anchor="middle">Flutter 3.x + BLoC</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="500" />
    <line x1="150" y1="0" x2="150" y2="500" />
    <line x1="250" y1="0" x2="250" y2="500" />
    <line x1="350" y1="0" x2="350" y2="500" />
    <line x1="450" y1="0" x2="450" y2="500" />
    <line x1="550" y1="0" x2="550" y2="500" />
    <line x1="650" y1="0" x2="650" y2="500" />
    <line x1="750" y1="0" x2="750" y2="500" />
  </g>

  <!-- Decorative Glow Circles -->
  <circle cx="200" cy="180" r="160" fill="#3b82f6" opacity="0.15" filter="blur(60px)" />
  <circle cx="600" cy="320" r="180" fill="#8b5cf6" opacity="0.12" filter="blur(70px)" />

  <!-- Main UI Window -->
  <g transform="translate(60, 45)">
    <!-- Window Container -->
    <rect width="680" height="410" rx="12" fill="#090d16" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
    
    <!-- Window Header -->
    <rect width="680" height="40" rx="12" fill="#131b2e" />
    <rect y="28" width="680" height="12" fill="#131b2e" />
    <circle cx="24" cy="20" r="5" fill="#ef4444" />
    <circle cx="42" cy="20" r="5" fill="#f59e0b" />
    <circle cx="60" cy="20" r="5" fill="#10b981" />
    <text x="340" y="25" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8" text-anchor="middle">bestlife.ai/wellness-dashboard</text>

    <!-- Sidebar -->
    <rect x="0" y="40" width="160" height="370" fill="#0c1222" />
    <rect x="20" y="65" width="120" height="28" rx="6" fill="url(#accentGrad)" opacity="0.9" />
    <text x="40" y="83" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#ffffff">Overview</text>
    
    <rect x="20" y="105" width="120" height="24" rx="4" fill="#ffffff" fill-opacity="0.04" />
    <text x="40" y="121" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748b">Habit Pulse</text>

    <rect x="20" y="137" width="120" height="24" rx="4" fill="#ffffff" fill-opacity="0.04" />
    <text x="40" y="153" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748b">AI Studio Prompts</text>

    <rect x="20" y="169" width="120" height="24" rx="4" fill="#ffffff" fill-opacity="0.04" />
    <text x="40" y="185" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748b">Analytics</text>

    <!-- Main Content Area -->
    <!-- Metric Cards -->
    <g transform="translate(180, 60)">
      <rect width="150" height="85" rx="8" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
      <text x="16" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8">Optimization Score</text>
      <text x="16" y="58" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="24" fill="#38bdf8">96.8%</text>
      <text x="16" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#10b981">+14.2% this week</text>

      <g transform="translate(165, 0)">
        <rect width="150" height="85" rx="8" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
        <text x="16" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8">Active AI Pipelines</text>
        <text x="16" y="58" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="24" fill="#a855f7">12 Live</text>
        <text x="16" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8">Gemini 1.5 Pro</text>
      </g>

      <g transform="translate(330, 0)">
        <rect width="150" height="85" rx="8" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
        <text x="16" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8">Token Latency</text>
        <text x="16" y="58" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="24" fill="#34d399">128ms</text>
        <text x="16" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#10b981">Ultra fast stream</text>
      </g>
    </g>

    <!-- Interactive AI Recommendation Chart -->
    <g transform="translate(180, 165)">
      <rect width="480" height="150" rx="8" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
      <text x="20" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13" fill="#ffffff">Google AI Studio Realtime Analysis</text>
      
      <!-- Wave / Graph -->
      <path d="M 30 110 Q 90 40, 150 75 T 270 50 T 390 90 T 450 35" fill="none" stroke="#38bdf8" stroke-width="3" />
      <path d="M 30 110 Q 90 40, 150 75 T 270 50 T 390 90 T 450 35 L 450 130 L 30 130 Z" fill="#38bdf8" fill-opacity="0.06" />

      <!-- Data markers -->
      <circle cx="150" cy="75" r="4" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
      <circle cx="270" cy="50" r="4" fill="#a855f7" stroke="#ffffff" stroke-width="1.5" />
      <circle cx="450" cy="35" r="5" fill="#34d399" stroke="#ffffff" stroke-width="2" />
    </g>

    <!-- Bottom AI Prompt Terminal Pill -->
    <g transform="translate(180, 330)">
      <rect width="480" height="42" rx="6" fill="#030712" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1" />
      <text x="16" y="26" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8">&gt; prompt_engine.generateSummary(userMetrics, model="gemini-pro")</text>
      <rect x="420" y="16" width="44" height="12" rx="3" fill="#10b981" fill-opacity="0.2" />
      <text x="442" y="25" font-family="'JetBrains Mono', monospace" font-size="9" fill="#34d399" text-anchor="middle">ACTIVE</text>
    </g>
  </g>
</svg>

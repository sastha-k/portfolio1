<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="docBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09141f" />
      <stop offset="100%" stop-color="#0b2416" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#docBg)" />
  <circle cx="250" cy="200" r="180" fill="#10b981" opacity="0.12" filter="blur(75px)" />

  <g transform="translate(60, 45)">
    <rect width="680" height="410" rx="12" fill="#0c1719" stroke="#10b981" stroke-opacity="0.25" stroke-width="1" />
    
    <!-- Title bar -->
    <rect width="680" height="40" rx="12" fill="#122421" />
    <circle cx="24" cy="20" r="5" fill="#ef4444" />
    <circle cx="42" cy="20" r="5" fill="#f59e0b" />
    <circle cx="60" cy="20" r="5" fill="#10b981" />
    <text x="340" y="25" font-family="'JetBrains Mono', monospace" font-size="12" fill="#6ee7b7" text-anchor="middle">trust-score.verify/cert-98421</text>

    <!-- Document Preview Card (Left) -->
    <g transform="translate(40, 60)">
      <rect width="260" height="320" rx="8" fill="#142823" stroke="#22543d" stroke-width="1" />
      
      <!-- Simulated Document Header -->
      <rect x="25" y="25" width="60" height="8" rx="2" fill="#6ee7b7" opacity="0.8" />
      <rect x="25" y="42" width="140" height="6" rx="2" fill="#94a3b8" opacity="0.4" />
      
      <!-- Seal / Shield -->
      <g transform="translate(190, 20)">
        <polygon points="15,0 30,8 30,22 15,30 0,22 0,8" fill="#10b981" opacity="0.8" />
        <path d="M 8 15 L 13 20 L 22 10" stroke="#042f2e" stroke-width="2.5" fill="none" stroke-linecap="round" />
      </g>

      <!-- OCR Scanning Beam -->
      <line x1="15" y1="120" x2="245" y2="120" stroke="#34d399" stroke-width="2" />
      <rect x="15" y="80" width="230" height="40" fill="#34d399" opacity="0.08" />

      <!-- Doc Text lines -->
      <rect x="25" y="75" width="200" height="5" rx="2" fill="#cbd5e1" opacity="0.3" />
      <rect x="25" y="95" width="180" height="5" rx="2" fill="#cbd5e1" opacity="0.3" />
      <rect x="25" y="140" width="210" height="5" rx="2" fill="#cbd5e1" opacity="0.3" />
      <rect x="25" y="160" width="190" height="5" rx="2" fill="#cbd5e1" opacity="0.3" />
      <rect x="25" y="180" width="150" height="5" rx="2" fill="#cbd5e1" opacity="0.3" />

      <!-- Verified Stamp Badge -->
      <g transform="translate(50, 230)">
        <rect width="160" height="45" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
        <text x="80" y="27" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="14" fill="#34d399" text-anchor="middle">VERIFIED 99.4%</text>
      </g>
    </g>

    <!-- Verification Analysis Right Panel -->
    <g transform="translate(330, 60)">
      <!-- Trust Score Gauge -->
      <rect width="310" height="150" rx="8" fill="#142823" stroke="#22543d" stroke-width="1" />
      <text x="20" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94a3b8">Document Integrity Index</text>
      <text x="20" y="70" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="38" fill="#34d399">99.4</text>
      <text x="120" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#10b981">GENUINE</text>
      <text x="120" y="72" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">Hash: 8f9b...a1c3</text>

      <!-- Checklist Items -->
      <g transform="translate(20, 95)">
        <circle cx="6" cy="6" r="5" fill="#10b981" />
        <text x="20" y="10" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#e2e8f0">Cryptographic Signature Valid</text>
        
        <circle cx="6" cy="28" r="5" fill="#10b981" />
        <text x="20" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#e2e8f0">Tamper &amp; Forgery Check Cleared</text>
      </g>

      <!-- Bottom Pipeline Details -->
      <g transform="translate(0, 170)">
        <rect width="310" height="150" rx="8" fill="#142823" stroke="#22543d" stroke-width="1" />
        <text x="20" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#ffffff">AI &amp; OCR Inspection Log</text>

        <rect x="20" y="42" width="270" height="24" rx="4" fill="#042f2e" />
        <text x="30" y="58" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6ee7b7">Tesseract OCR &gt; Extracting text: OK</text>

        <rect x="20" y="72" width="270" height="24" rx="4" fill="#042f2e" />
        <text x="30" y="88" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6ee7b7">Font consistency &gt; 98.7% match</text>

        <rect x="20" y="102" width="270" height="24" rx="4" fill="#042f2e" />
        <text x="30" y="118" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6ee7b7">Metadata timestamp &gt; Untampered</text>
      </g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.35">
    <line x1="100" y1="0" x2="100" y2="500" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="300" y1="0" x2="300" y2="500" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="500" y1="0" x2="500" y2="500" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="700" y1="0" x2="700" y2="500" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="0" y1="125" x2="800" y2="125" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="0" y1="250" x2="800" y2="250" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="0" y1="375" x2="800" y2="375" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/>
  </g>

  <!-- Phone Mockup 1 (Primary - App Home) -->
  <g transform="translate(180, 45)" filter="url(#shadow)">
    <!-- Device Frame -->
    <rect width="240" height="420" rx="36" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Speaker & Camera -->
    <rect x="85" y="12" width="70" height="16" rx="8" fill="#0f172a"/>
    <circle cx="140" cy="20" r="3" fill="#1e293b"/>
    
    <!-- App Header -->
    <g transform="translate(18, 42)">
      <circle cx="12" cy="12" r="10" fill="#f1f5f9"/>
      <rect x="30" y="4" width="60" height="6" rx="3" fill="#94a3b8"/>
      <rect x="30" y="14" width="90" height="8" rx="4" fill="#0f172a"/>
      <circle cx="190" cy="12" r="12" fill="#eff6ff"/>
      <circle cx="190" cy="12" r="4" fill="#2563eb"/>
    </g>

    <!-- Search Bar -->
    <rect x="18" y="76" width="204" height="34" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="34" cy="93" r="5" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
    <line x1="38" y1="97" x2="42" y2="101" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="50" y="90" width="80" height="6" rx="3" fill="#cbd5e1"/>

    <!-- Category Chips -->
    <g transform="translate(18, 122)">
      <rect x="0" y="0" width="56" height="26" rx="13" fill="#0f172a"/>
      <rect x="14" y="10" width="28" height="6" rx="3" fill="#ffffff"/>
      <rect x="64" y="0" width="56" height="26" rx="13" fill="#f1f5f9"/>
      <rect x="76" y="10" width="32" height="6" rx="3" fill="#64748b"/>
      <rect x="128" y="0" width="56" height="26" rx="13" fill="#f1f5f9"/>
      <rect x="140" y="10" width="32" height="6" rx="3" fill="#64748b"/>
    </g>

    <!-- Featured Food Card -->
    <g transform="translate(18, 160)">
      <rect width="204" height="120" rx="16" fill="url(#cardGrad)" stroke="#f1f5f9" stroke-width="1"/>
      <rect width="204" height="68" rx="16" fill="#fed7aa"/>
      <circle cx="102" cy="34" r="22" fill="#f97316" opacity="0.8"/>
      <!-- Food title & details -->
      <rect x="14" y="78" width="110" height="8" rx="4" fill="#0f172a"/>
      <rect x="14" y="92" width="70" height="6" rx="3" fill="#94a3b8"/>
      <rect x="14" y="104" width="40" height="7" rx="3.5" fill="#f97316"/>
      <rect x="160" y="98" width="30" height="14" rx="7" fill="#0f172a"/>
      <text x="175" y="108" fill="#ffffff" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">+</text>
    </g>

    <!-- Popular Items List -->
    <g transform="translate(18, 292)">
      <rect width="204" height="46" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="28" cy="23" r="14" fill="#fed7aa"/>
      <rect x="52" y="14" width="80" height="7" rx="3.5" fill="#0f172a"/>
      <rect x="52" y="25" width="50" height="5" rx="2.5" fill="#94a3b8"/>
      <rect x="156" y="18" width="34" height="12" rx="6" fill="#2563eb"/>
    </g>

    <!-- Bottom Navigation Bar -->
    <g transform="translate(18, 360)">
      <rect width="204" height="42" rx="21" fill="#0f172a"/>
      <circle cx="34" cy="21" r="5" fill="#ffffff"/>
      <circle cx="80" cy="21" r="4" fill="#64748b"/>
      <circle cx="126" cy="21" r="4" fill="#64748b"/>
      <circle cx="170" cy="21" r="4" fill="#64748b"/>
    </g>
  </g>

  <!-- Phone Mockup 2 (Secondary - Order & Tracking) -->
  <g transform="translate(450, 75)" filter="url(#shadow)">
    <!-- Device Frame -->
    <rect width="210" height="380" rx="32" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="75" y="10" width="60" height="14" rx="7" fill="#0f172a"/>

    <!-- Order Status Card -->
    <g transform="translate(16, 40)">
      <rect width="178" height="100" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <circle cx="32" cy="32" r="14" fill="#2563eb"/>
      <path d="M28 32 L31 35 L37 29" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="56" y="24" width="70" height="7" rx="3.5" fill="#1e3a8a"/>
      <rect x="56" y="35" width="95" height="5" rx="2.5" fill="#3b82f6"/>

      <!-- Progress bar -->
      <rect x="16" y="68" width="146" height="6" rx="3" fill="#dbeafe"/>
      <rect x="16" y="68" width="105" height="6" rx="3" fill="#2563eb"/>
      <circle cx="121" cy="71" r="5" fill="#2563eb"/>
    </g>

    <!-- Cart Items Detail -->
    <g transform="translate(16, 155)">
      <rect width="178" height="42" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="12" y="12" width="20" height="18" rx="4" fill="#fde68a"/>
      <rect x="40" y="13" width="70" height="6" rx="3" fill="#0f172a"/>
      <rect x="40" y="23" width="40" height="5" rx="2.5" fill="#94a3b8"/>
      <rect x="135" y="16" width="30" height="10" rx="5" fill="#cbd5e1"/>
    </g>

    <g transform="translate(16, 205)">
      <rect width="178" height="42" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="12" y="12" width="20" height="18" rx="4" fill="#fed7aa"/>
      <rect x="40" y="13" width="60" height="6" rx="3" fill="#0f172a"/>
      <rect x="40" y="23" width="35" height="5" rx="2.5" fill="#94a3b8"/>
      <rect x="135" y="16" width="30" height="10" rx="5" fill="#cbd5e1"/>
    </g>

    <!-- Total & Pay Button -->
    <g transform="translate(16, 260)">
      <rect width="178" height="85" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="14" y="16" width="40" height="6" rx="3" fill="#94a3b8"/>
      <rect x="125" y="14" width="38" height="9" rx="4.5" fill="#0f172a"/>
      <!-- Track Order CTA Button -->
      <rect x="14" y="38" width="150" height="34" rx="10" fill="url(#orangeGrad)"/>
      <rect x="45" y="51" width="88" height="8" rx="4" fill="#ffffff"/>
    </g>
  </g>

  <!-- Figma Pill Badge -->
  <g transform="translate(48, 50)" filter="url(#shadow)">
    <rect width="105" height="36" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="20" cy="18" r="8" fill="#0f172a"/>
    <text x="56" y="22" fill="#0f172a" font-size="12" font-family="monospace" font-weight="bold">FIGMA UI</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="urbanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f2b38" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#urbanBg)" />

  <!-- Radial glow -->
  <circle cx="400" cy="250" r="220" fill="#06b6d4" opacity="0.12" filter="blur(80px)" />

  <g transform="translate(60, 45)">
    <!-- Dashboard Window -->
    <rect width="680" height="410" rx="12" fill="#0b1320" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1" />
    
    <!-- Title bar -->
    <rect width="680" height="40" rx="12" fill="#111c2e" />
    <circle cx="24" cy="20" r="5" fill="#ef4444" />
    <circle cx="42" cy="20" r="5" fill="#f59e0b" />
    <circle cx="60" cy="20" r="5" fill="#10b981" />
    <text x="340" y="25" font-family="'JetBrains Mono', monospace" font-size="12" fill="#7dd3fc" text-anchor="middle">urban-mobility.analytics.gov/telemetry</text>

    <!-- Top Stats Row -->
    <g transform="translate(30, 60)">
      <rect width="140" height="70" rx="8" fill="#162238" stroke="#0ea5e9" stroke-opacity="0.3" stroke-width="1" />
      <text x="14" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8">Fleet Density</text>
      <text x="14" y="52" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="22" fill="#38bdf8">1,842</text>
      <text x="75" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#34d399">Live GPS</text>

      <g transform="translate(160, 0)">
        <rect width="140" height="70" rx="8" fill="#162238" stroke="#0ea5e9" stroke-opacity="0.3" stroke-width="1" />
        <text x="14" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8">Avg Transit Time</text>
        <text x="14" y="52" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="22" fill="#f59e0b">18.4m</text>
        <text x="85" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#f43f5e">-12% peak</text>
      </g>

      <g transform="translate(320, 0)">
        <rect width="140" height="70" rx="8" fill="#162238" stroke="#0ea5e9" stroke-opacity="0.3" stroke-width="1" />
        <text x="14" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8">Congestion Index</text>
        <text x="14" y="52" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="22" fill="#22c55e">Low</text>
        <text x="65" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#34d399">Optimal</text>
      </g>

      <g transform="translate(480, 0)">
        <rect width="140" height="70" rx="8" fill="#162238" stroke="#0ea5e9" stroke-opacity="0.3" stroke-width="1" />
        <text x="14" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8">CO2 Saved</text>
        <text x="14" y="52" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="22" fill="#a855f7">4.2 Ton</text>
        <text x="95" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#a855f7">Smart AI</text>
      </g>
    </g>

    <!-- Map & Route Telemetry Section -->
    <g transform="translate(30, 150)">
      <!-- Map simulated surface -->
      <rect width="400" height="230" rx="8" fill="#080f1a" stroke="#1e293b" stroke-width="1" />
      
      <!-- Grid routes -->
      <path d="M 20 60 L 380 60 M 20 120 L 380 120 M 20 180 L 380 180" stroke="#1e293b" stroke-width="1.5" />
      <path d="M 80 20 L 80 210 M 180 20 L 180 210 M 280 20 L 280 210" stroke="#1e293b" stroke-width="1.5" />

      <!-- Glowing Transit Route line -->
      <path d="M 40 180 L 80 180 L 80 120 L 180 120 L 180 60 L 340 60" fill="none" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 40 180 L 80 180 L 80 120 L 180 120 L 180 60 L 340 60" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.3" filter="blur(3px)" />

      <!-- Alternate path -->
      <path d="M 80 180 L 280 180 L 280 120 L 360 120" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" stroke-dasharray="6,4" />

      <!-- Nodes / Waypoints -->
      <circle cx="80" cy="180" r="6" fill="#06b6d4" stroke="#ffffff" stroke-width="2" />
      <circle cx="180" cy="120" r="6" fill="#06b6d4" stroke="#ffffff" stroke-width="2" />
      <circle cx="340" cy="60" r="7" fill="#10b981" stroke="#ffffff" stroke-width="2" />
      <text x="340" y="44" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34d399" text-anchor="middle">Hub Alpha</text>
    </g>

    <!-- Right Side Bar Chart & Stats -->
    <g transform="translate(450, 150)">
      <rect width="200" height="230" rx="8" fill="#080f1a" stroke="#1e293b" stroke-width="1" />
      <text x="16" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#ffffff">Hourly Traffic Flow</text>

      <!-- Bars -->
      <g transform="translate(20, 50)">
        <rect x="0" y="90" width="16" height="50" rx="3" fill="#0ea5e9" opacity="0.6" />
        <rect x="26" y="50" width="16" height="90" rx="3" fill="#0ea5e9" opacity="0.8" />
        <rect x="52" y="20" width="16" height="120" rx="3" fill="#06b6d4" />
        <rect x="78" y="40" width="16" height="100" rx="3" fill="#0ea5e9" opacity="0.9" />
        <rect x="104" y="70" width="16" height="70" rx="3" fill="#0ea5e9" opacity="0.7" />
        <rect x="130" y="100" width="16" height="40" rx="3" fill="#0ea5e9" opacity="0.5" />
        
        <text x="8" y="155" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b" text-anchor="middle">08</text>
        <text x="34" y="155" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b" text-anchor="middle">10</text>
        <text x="60" y="155" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8" text-anchor="middle">12</text>
        <text x="86" y="155" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b" text-anchor="middle">14</text>
        <text x="112" y="155" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b" text-anchor="middle">16</text>
        <text x="138" y="155" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b" text-anchor="middle">18</text>
      </g>

      <rect x="16" y="195" width="168" height="24" rx="4" fill="#0f172a" />
      <text x="100" y="211" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8" text-anchor="middle">Python ML Model: OK</text>
    </g>
  </g>
</svg>
